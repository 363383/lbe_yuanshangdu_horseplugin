plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.unity3dbluetoothplugin'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.unity3dbluetoothplugin"
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // debug build for testing
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
